<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- deep green background -->
  <rect width="64" height="64" rx="14" fill="#0d3b2e"/>
  <!-- inner gold frame -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#b8923f" stroke-width="2" opacity="0.9"/>
  <!-- crescent moon (dreams / night) -->
  <path d="M40 12 a20 20 0 1 0 0 40 a16 16 0 0 1 0 -40" fill="#faf6ec"/>
  <!-- eight-point star (islamic geometric ornament) -->
  <g fill="#b8923f">
    <path d="M32 22 l3.2 6.8 L42 32 l-6.8 3.2 L32 42 l-3.2 -6.8 L22 32 l6.8 -3.2 Z"/>
    <path d="M32 22 l2.4 2.4 L36.8 22 l-2.4 2.4 Z" />
  </g>
</svg>
