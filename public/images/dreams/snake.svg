<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Snake dream symbol illustration">
  <rect width="600" height="600" fill="#faf6ec"/>
  <!-- geometric frame -->
  <g fill="none" stroke="#b8923f" stroke-width="2" opacity="0.55">
    <rect x="28" y="28" width="544" height="544" rx="18"/>
    <rect x="44" y="44" width="512" height="512" rx="12" stroke-width="1" opacity="0.7"/>
  </g>
  <!-- corner ornament (eight-point star) -->
  <g fill="none" stroke="#0d3b2e" stroke-width="1.4" opacity="0.35">
    <path d="M28 118 L58 88 L88 118 L58 148 Z"/>
    <path d="M28 118 L58 148 L88 118"/>
    <path d="M512 118 L542 88 L572 118 L542 148 Z"/>
    <path d="M512 118 L542 148 L572 118"/>
    <path d="M28 482 L58 452 L88 482 L58 512 Z"/>
    <path d="M28 482 L58 512 L88 482"/>
    <path d="M512 482 L542 452 L572 482 L542 512 Z"/>
    <path d="M512 482 L542 512 L572 482"/>
  </g>
  <!-- body of snake: S-curve -->
  <path d="M300 150 C 390 150, 420 210, 380 260 C 340 310, 260 250, 220 300 C 180 350, 210 430, 300 440 C 380 448, 410 400, 400 360"
        fill="none" stroke="#16543f" stroke-width="34" stroke-linecap="round"/>
  <path d="M300 150 C 390 150, 420 210, 380 260 C 340 310, 260 250, 220 300 C 180 350, 210 430, 300 440 C 380 448, 410 400, 400 360"
        fill="none" stroke="#2a7a5c" stroke-width="18" stroke-linecap="round"/>
  <!-- scale dashes -->
  <g stroke="#0d3b2e" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M330 168 l10 -14"/>
    <path d="M356 196 l12 -12"/>
    <path d="M372 228 l8 -12"/>
    <path d="M196 306 l-12 -12"/>
    <path d="M212 338 l-12 -8"/>
    <path d="M246 382 l-6 -12"/>
    <path d="M330 424 l-8 -12"/>
    <path d="M370 408 l-4 -12"/>
  </g>
  <!-- head -->
  <g>
    <ellipse cx="398" cy="338" rx="44" ry="30" fill="#16543f" transform="rotate(-20 398 338)"/>
    <circle cx="412" cy="326" r="7" fill="#d3ac5e"/>
    <path d="M352 350 q46 -26 88 -8" fill="none" stroke="#0d3b2e" stroke-width="3" stroke-linecap="round"/>
    <path d="M358 356 q42 -18 76 -4" fill="none" stroke="#b8923f" stroke-width="2" stroke-linecap="round"/>
    <!-- forked tongue -->
    <path d="M444 322 l34 6 l-14 14 l4 -18" fill="none" stroke="#b8923f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- ground shadow -->
  <ellipse cx="300" cy="500" rx="170" ry="14" fill="#0d3b2e" opacity="0.10"/>
</svg>
